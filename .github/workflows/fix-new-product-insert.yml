name: Fix New Product Insert
on:
  push:
    branches: [control-center-controlled-apply-v2]
    paths: [".github/workflows/fix-new-product-insert.yml"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control-center-controlled-apply-v2
      - run: python control-center/tests/fix_new_product_insert_once.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-center/api/create-new-product.js control-center/tests/controlled-apply-new-product.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Fix new-product insertion targets and separators"
          git push origin HEAD:control-center-controlled-apply-v2
# trigger
