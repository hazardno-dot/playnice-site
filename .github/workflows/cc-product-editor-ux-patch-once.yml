name: CC product editor UX patch once

on:
  push:
    paths:
      - '.github/scripts/cc-product-editor-ux-patch.py'
      - '.github/workflows/cc-product-editor-ux-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc-product-editor-ux-patch
          fetch-depth: 0
      - name: Apply UX patch
        run: python .github/scripts/cc-product-editor-ux-patch.py
      - name: Verify UX contract
        run: |
          grep -q 'SelectField label="Category"' control-center/src/App.jsx
          grep -q 'SelectField label="Season"' control-center/src/App.jsx
          grep -q 'badge:"",rating:"",ratingLabel:""' control-center/src/App.jsx
          grep -q 'FIELDS REMAINING' control-center/src/InlineValidationBridge.jsx
          grep -q 'left:270px' control-center/src/inline-validation.css
      - name: Install Control Center dependencies
        working-directory: control-center
        run: npm install
      - name: Control Center production build
        working-directory: control-center
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control-center/src/App.jsx control-center/src/InlineValidationBridge.jsx control-center/src/inline-validation.css control-center/src/editor.css
          git commit -m 'feat: improve product draft editor UX'
          git push origin HEAD:cc-product-editor-ux-patch
