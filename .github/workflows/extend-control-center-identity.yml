name: Extend Controlled Apply Identity

on:
  push:
    branches:
      - control-center-controlled-apply-v2
    paths:
      - ".github/workflows/extend-control-center-identity.yml"

permissions:
  contents: write

jobs:
  extend-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: control-center-controlled-apply-v2

      - name: Apply identity-safe rename extension
        run: python control-center/tests/extend_identity_once.py

      - name: Commit identity support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-center/api/create-apply.js control-center/tests/controlled-apply-identity.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Extend Controlled Apply v2.7 to identity-safe renames"
          git push origin HEAD:control-center-controlled-apply-v2
