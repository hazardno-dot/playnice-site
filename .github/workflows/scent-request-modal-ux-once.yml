name: Patch scent request modal UX once
on:
  push:
    branches: [scent-request-vote-guardrails]
    paths: [.github/workflows/scent-request-modal-ux-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scent-request-vote-guardrails
      - name: Patch App.js
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('playnice-site/src/App.js')
          raw = p.read_text(encoding='utf-8')
          newline = '\r\n' if '\r\n' in raw else '\n'
          s = raw.replace('\r\n','\n')

          state_old = '''  const [productModalVisible, setProductModalVisible] = useState(false);\n  const [noteMapOpen, setNoteMapOpen] = useState(false);'''
          state_new = '''  const [productModalVisible, setProductModalVisible] = useState(false);\n  const productModalReturnScrollRef = useRef(null);\n  const productRequestOpenTimeoutRef = useRef(null);\n  const [noteMapOpen, setNoteMapOpen] = useState(false);'''
          if state_old not in s:
              raise SystemExit('product modal state anchor not found')
          s = s.replace(state_old, state_new, 1)

          open_old = '''const openProductFromRequest = (product) => {\n  if (!product) return;\n\n  setSelectedProduct(product);\n  setProductModalVisible(true);\n};'''
          open_new = '''const openProductFromRequest = (product) => {\n  if (!product) return;\n\n  productModalReturnScrollRef.current = window.scrollY;\n\n  if (productRequestOpenTimeoutRef.current) {\n    clearTimeout(productRequestOpenTimeoutRef.current);\n  }\n\n  productRequestOpenTimeoutRef.current = setTimeout(() => {\n    productRequestOpenTimeoutRef.current = null;\n    setSelectedProduct(product);\n    setProductModalVisible(true);\n  }, 450);\n};'''
          if open_old not in s:
              raise SystemExit('openProductFromRequest anchor not found')
          s = s.replace(open_old, open_new, 1)

          close_anchor = '''const closeProductModal = (\n  cleanupDelay = PRODUCT_MODAL_CLOSE_DELAY\n) => {\n  const isMobileModal = isMobileProductModal();'''
          close_new = '''const closeProductModal = (\n  cleanupDelay = PRODUCT_MODAL_CLOSE_DELAY\n) => {\n  const isMobileModal = isMobileProductModal();\n  const returnScrollY = productModalReturnScrollRef.current;\n\n  if (Number.isFinite(returnScrollY)) {\n    window.setTimeout(() => {\n      window.scrollTo({ top: returnScrollY, left: 0, behavior: "auto" });\n      productModalReturnScrollRef.current = null;\n    }, cleanupDelay + 60);\n  }'''
          if close_anchor not in s:
              raise SystemExit('closeProductModal anchor not found')
          s = s.replace(close_anchor, close_new, 1)

          cleanup_anchor = '''useEffect(() => {\n  return () => {\n    if (productModalCloseTimeoutRef.current) {'''
          cleanup_new = '''useEffect(() => {\n  return () => {\n    if (productRequestOpenTimeoutRef.current) {\n      clearTimeout(productRequestOpenTimeoutRef.current);\n    }\n\n    if (productModalCloseTimeoutRef.current) {'''
          if cleanup_anchor not in s:
              raise SystemExit('modal cleanup anchor not found')
          s = s.replace(cleanup_anchor, cleanup_new, 1)

          p.write_text(s.replace('\n', newline), encoding='utf-8', newline='')
          PY
      - name: Install and test
        working-directory: playnice-site
        run: |
          npm install --package-lock=false
          npm test -- --watchAll=false
      - name: Production build
        working-directory: playnice-site
        env:
          DISABLE_ESLINT_PLUGIN: "true"
        run: npx react-scripts build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playnice-site/src/App.js
          git commit -m "fix: preserve scent request modal context"
          git push origin scent-request-vote-guardrails
