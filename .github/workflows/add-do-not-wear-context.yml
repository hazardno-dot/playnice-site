name: Add do-not-wear context

on:
  push:
    branches:
      - mobile-product-page-clean
    paths:
      - playnice-site/scripts/add-do-not-wear-context.cjs
      - .github/workflows/add-do-not-wear-context.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-product-page-clean
          fetch-depth: 0
      - name: Generate data and wire PDP
        run: node playnice-site/scripts/add-do-not-wear-context.cjs
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playnice-site/src/data/products/productDoNotWearContext.js playnice-site/src/mobile-v2/product-page/MobileProductPage.jsx
          git commit -m "Add when-not-to-wear editorial context [skip ci]"
          git push origin HEAD:mobile-product-page-clean
