name: Restore PDP header heart SVG

on:
  push:
    branches:
      - mobile-product-page-clean
    paths:
      - playnice-site/scripts/restore-pdp-heart-svg.cjs
      - .github/workflows/restore-pdp-heart-svg.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile-product-page-clean
          fetch-depth: 0

      - name: Apply guarded PDP heart restore
        run: node playnice-site/scripts/restore-pdp-heart-svg.cjs

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playnice-site/src/mobile-v2/product-page/MobileProductPage.jsx playnice-site/src/mobile-v2/product-page/MobileProductPage.css
          git commit -m "Match mobile PDP wishlist to header heart geometry [skip ci]"
          git push origin HEAD:mobile-product-page-clean
