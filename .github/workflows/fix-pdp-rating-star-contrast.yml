name: Fix PDP rating star contrast

on:
  push:
    branches:
      - mobile-product-page-clean
    paths:
      - playnice-site/scripts/fix-pdp-rating-star-contrast.cjs
      - .github/workflows/fix-pdp-rating-star-contrast.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-product-page-clean
          fetch-depth: 0
      - name: Apply rating star contrast fix
        run: node playnice-site/scripts/fix-pdp-rating-star-contrast.cjs
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playnice-site/src/mobile-v2/product-page/MobileProductPage.jsx playnice-site/src/mobile-v2/product-page/MobileProductPage.css
          git commit -m "Differentiate filled and empty PDP rating stars [skip ci]"
          git push origin HEAD:mobile-product-page-clean
