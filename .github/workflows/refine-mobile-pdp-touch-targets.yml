name: Refine mobile PDP touch targets

on:
  push:
    branches:
      - mobile-product-page-clean
    paths:
      - scripts/refine-mobile-pdp-touch-targets.cjs
      - .github/workflows/refine-mobile-pdp-touch-targets.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile-product-page-clean
          fetch-depth: 0

      - name: Apply guarded codemod
        run: node scripts/refine-mobile-pdp-touch-targets.cjs

      - name: Commit source change
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playnice-site/src/mobile-v2/product-page/MobileProductPage.jsx
          git commit -m "Refine mobile PDP note map touch behavior [skip ci]"
          git push origin HEAD:mobile-product-page-clean
