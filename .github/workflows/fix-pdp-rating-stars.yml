name: Fix PDP rating stars

on:
  push:
    branches:
      - mobile-product-page-clean
    paths:
      - playnice-site/scripts/fix-pdp-rating-stars.cjs
      - .github/workflows/fix-pdp-rating-stars.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-product-page-clean
          fetch-depth: 0
      - run: node playnice-site/scripts/fix-pdp-rating-stars.cjs
      - run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playnice-site/src/mobile-v2/product-page/MobileProductPage.jsx
          git commit -m "Make mobile PDP stars reflect rating [skip ci]"
          git push origin HEAD:mobile-product-page-clean
