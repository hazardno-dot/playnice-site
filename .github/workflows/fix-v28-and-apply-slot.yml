name: Fix v2.8 and Controlled Apply Slot

on:
  push:
    branches: [control-center-controlled-apply-v2]
    paths: [".github/workflows/fix-v28-and-apply-slot.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control-center-controlled-apply-v2
      - name: Apply fixes
        run: python control-center/tests/fix_v28_and_apply_slot_once.py
      - name: Run new-product regression
        run: node control-center/tests/controlled-apply-new-product.mjs
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-center/api/create-new-product.js control-center/tests/controlled-apply-new-product.mjs control-center/src/App.jsx control-center/src/ControlledApplyManager.jsx control-center/src/controlled-apply.css
          git diff --cached --quiet && exit 0
          git commit -m "Fix v2.8 new-product insertion and place Controlled Apply near top"
          git push origin HEAD:control-center-controlled-apply-v2
