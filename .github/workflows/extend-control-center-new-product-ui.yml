name: Extend Control Center New Product UI

on:
  push:
    branches:
      - control-center-controlled-apply-v2
    paths:
      - ".github/workflows/extend-control-center-new-product-ui.yml"

permissions:
  contents: write

jobs:
  extend-new-product-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: control-center-controlled-apply-v2

      - name: Apply new-product UI integration
        run: python control-center/tests/extend_new_product_ui_once.py

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-center/src/App.jsx control-center/src/DraftManager.jsx control-center/src/ControlledApplyManager.jsx control-center/src/draftValidation.js control-center/api/create-new-product.js
          git diff --cached --quiet && exit 0
          git commit -m "Integrate new-product workflow into Control Center"
          git push origin HEAD:control-center-controlled-apply-v2
