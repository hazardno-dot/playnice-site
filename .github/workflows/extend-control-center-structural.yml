name: Extend Controlled Apply Structural Editing

on:
  push:
    branches:
      - control-center-controlled-apply-v2
    paths:
      - ".github/workflows/extend-control-center-structural.yml"

permissions:
  contents: write

jobs:
  extend-structural:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: control-center-controlled-apply-v2

      - name: Apply structural editing extension
        run: python control-center/tests/extend_structural_once.py

      - name: Commit structural editing support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-center/api/create-apply.js control-center/src/App.jsx control-center/tests/controlled-apply-regression.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Extend Controlled Apply v2.6 to structural sizes and notes"
          git push origin HEAD:control-center-controlled-apply-v2

# retry after robust patch script
