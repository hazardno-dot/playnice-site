name: Finalize mobile PDP cleanup

on:
  push:
    branches:
      - mobile-product-page-clean
    paths:
      - scripts/finalize-mobile-pdp-cleanup.cjs
      - .github/workflows/finalize-mobile-pdp-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile-product-page-clean
          fetch-depth: 0

      - name: Apply guarded cleanup
        run: node scripts/finalize-mobile-pdp-cleanup.cjs

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playnice-site/src/mobile-v2/product-page/MobileProductPage.css playnice-site/src/mobile-v2/product-page/MobileProductPage.jsx playnice-site/src/index.js playnice-site/src/App.js playnice-site/src/mobile-v2/product-page/MobileProductPageFixes.css
          git commit -m "Finalize clean mobile PDP structure [skip ci]"
          git push origin HEAD:mobile-product-page-clean
