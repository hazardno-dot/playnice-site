name: Patch wishlist surfaces

on:
  push:
    branches:
      - just-in-image-scale

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: just-in-image-scale

      - name: Patch App.js
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/App.js")
          text = path.read_text(encoding="utf-8")

          if "modal-wishlist-btn" in text and "new-arrival-card-shell" in text:
              print("Wishlist surfaces already patched.")
              raise SystemExit(0)

          modal_old = '''<div
            className={`modal-image-wrap panel-item-anim panel-item-2 ${
              selectedProduct.noteMap ? "has-note-map" : ""
            } ${noteMapOpen ? "note-map-open" : ""}`}
          >
            {selectedProduct.image ? ('''

          modal_new = '''<div
            className={`modal-image-wrap panel-item-anim panel-item-2 ${
              selectedProduct.noteMap ? "has-note-map" : ""
            } ${noteMapOpen ? "note-map-open" : ""}`}
          >
            <button
              type="button"
              className={`wishlist-btn modal-wishlist-btn ${
                wishlist.includes(selectedProduct.id) ? "active" : ""
              }`}
              onMouseDown={(event) => {
                event.preventDefault();
                event.stopPropagation();
              }}
              onPointerDown={(event) => event.stopPropagation()}
              onClick={(event) => {
                event.preventDefault();
                event.stopPropagation();
                toggleWishlist(selectedProduct.id);
              }}
              aria-label={
                wishlist.includes(selectedProduct.id)
                  ? lang === "sr"
                    ? `Ukloni ${selectedProduct.name} iz Private Selection`
                    : `Remove ${selectedProduct.name} from Private Selection`
                  : lang === "sr"
                    ? `Dodaj ${selectedProduct.name} u Private Selection`
                    : `Add ${selectedProduct.name} to Private Selection`
              }
            >
              <span className="heart-icon" aria-hidden="true">♥</span>
            </button>

            {selectedProduct.image ? ('''

          if modal_old not in text:
              raise SystemExit("Modal image anchor not found; refusing unsafe patch.")
          text = text.replace(modal_old, modal_new, 1)

          map_old = '''          {newArrivalProducts.map((product) => {
            const minPrice = getMinPrice(product);

            return ('''
          map_new = '''          {newArrivalProducts.map((product) => {
            const minPrice = getMinPrice(product);
            const isWishlisted = wishlist.includes(product.id);

            return ('''
          if map_old not in text:
              raise SystemExit("Just In map anchor not found; refusing unsafe patch.")
          text = text.replace(map_old, map_new, 1)

          card_pattern = re.compile(
              r'''            return \(\n'''
              r'''              <button\n'''
              r'''                key=\{`\$\{groupIndex\}-\$\{product\.id\}`\}\n'''
              r'''(?P<button_rest>                type="button"\n'''
              r'''                className="new-arrival-card"[\s\S]*?              </button>)\n'''
              r'''            \);'''
          )

          match = card_pattern.search(text)
          if not match:
              raise SystemExit("Just In card block not found; refusing unsafe patch.")

          button_rest = match.group("button_rest")
          replacement = '''            return (
              <div
                key={`${groupIndex}-${product.id}`}
                className="new-arrival-card-shell"
              >
              <button
''' + button_rest + '''

                <button
                  type="button"
                  className={`wishlist-btn new-arrival-wishlist-btn ${
                    isWishlisted ? "active" : ""
                  }`}
                  tabIndex={isClone ? -1 : 0}
                  onMouseDown={(event) => {
                    event.preventDefault();
                    event.stopPropagation();
                  }}
                  onPointerDown={(event) => event.stopPropagation()}
                  onClick={(event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    toggleWishlist(product.id);
                  }}
                  aria-label={
                    isWishlisted
                      ? lang === "sr"
                        ? `Ukloni ${product.name} iz Private Selection`
                        : `Remove ${product.name} from Private Selection`
                      : lang === "sr"
                        ? `Dodaj ${product.name} u Private Selection`
                        : `Add ${product.name} to Private Selection`
                  }
                >
                  <span className="heart-icon" aria-hidden="true">♥</span>
                </button>
              </div>
            );'''

          text = text[:match.start()] + replacement + text[match.end():]
          path.write_text(text, encoding="utf-8")
          print("Patched modal and Just In wishlist actions.")
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- src/App.js; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.js
          git commit -m "Add Private Selection hearts to modal and Just In"
          git push origin HEAD:just-in-image-scale
