name: Apply scent request guardrails once

on:
  push:
    branches:
      - scent-request-vote-guardrails
    paths:
      - .github/workflows/scent-request-guardrails-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scent-request-vote-guardrails

      - name: Patch App.js
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("playnice-site/src/App.js")
          source = path.read_text(encoding="utf-8")

          old = '''const normalizeScentName = (value = "") =>
            value
              .toLowerCase()
              .normalize("NFD")
              .replace(/[\\u0300-\\u036f]/g, "")
              .replace(/[^a-z0-9]+/g, " ")
              .trim();

          const findExistingProductByRequest = (requestName) => {
            const normalizedRequest = normalizeScentName(requestName);

            if (!normalizedRequest) return null;

            return products.find((product) => {
              const productName = normalizeScentName(product.name || "");
              const productBrand = normalizeScentName(product.brand || "");
              const combined = normalizeScentName(`${product.name || ""} ${product.brand || ""}`);

              return (
                productName.includes(normalizedRequest) ||
                normalizedRequest.includes(productName) ||
                combined.includes(normalizedRequest) ||
                normalizedRequest.includes(combined) ||
                productBrand.includes(normalizedRequest)
              );
            });
          };'''

          new = '''const SCENT_NAME_NOISE_WORDS = new Set([
            "eau",
            "de",
            "parfum",
            "perfume",
            "edp",
            "edt",
            "cologne",
            "extrait",
            "extract",
            "spray",
          ]);

          const normalizeScentName = (value = "") =>
            String(value || "")
              .toLowerCase()
              .normalize("NFD")
              .replace(/[\\u0300-\\u036f]/g, "")
              .replace(/&/g, " and ")
              .replace(/[^a-z0-9]+/g, " ")
              .split(/\\s+/)
              .filter(Boolean)
              .filter((token) => !SCENT_NAME_NOISE_WORDS.has(token))
              .join(" ")
              .trim();

          const getScentNameTokens = (value = "") =>
            normalizeScentName(value).split(" ").filter(Boolean);

          const getScentTokenDistance = (left = "", right = "") => {
            if (left === right) return 0;
            if (!left || !right) return Math.max(left.length, right.length);

            const previous = Array.from({ length: right.length + 1 }, (_, index) => index);

            for (let i = 1; i <= left.length; i += 1) {
              let diagonal = previous[0];
              previous[0] = i;

              for (let j = 1; j <= right.length; j += 1) {
                const above = previous[j];
                const substitutionCost = left[i - 1] === right[j - 1] ? 0 : 1;

                previous[j] = Math.min(
                  previous[j] + 1,
                  previous[j - 1] + 1,
                  diagonal + substitutionCost
                );

                diagonal = above;
              }
            }

            return previous[right.length];
          };

          const scentTokensMatch = (requestToken, candidateToken) => {
            if (requestToken === candidateToken) return true;

            const minLength = Math.min(requestToken.length, candidateToken.length);

            if (minLength < 5) return false;

            return getScentTokenDistance(requestToken, candidateToken) <= 1;
          };

          const getProductRequestNames = (product) =>
            [
              product.shortName,
              product.cardName,
              product.name,
              product.brand && product.shortName
                ? `${product.brand} ${product.shortName}`
                : "",
              product.slug,
              ...(Array.isArray(product.aliases) ? product.aliases : []),
            ]
              .map(normalizeScentName)
              .filter(Boolean);

          const getScentRequestMatchScore = (requestName, product) => {
            const normalizedRequest = normalizeScentName(requestName);

            if (!normalizedRequest) return 0;

            const requestTokens = getScentNameTokens(normalizedRequest);
            const candidates = getProductRequestNames(product);
            let bestScore = 0;

            candidates.forEach((candidate) => {
              if (candidate === normalizedRequest) {
                bestScore = Math.max(bestScore, 100);
                return;
              }

              if (
                normalizedRequest.length >= 4 &&
                (candidate.includes(normalizedRequest) || normalizedRequest.includes(candidate))
              ) {
                bestScore = Math.max(bestScore, 90);
              }

              const candidateTokens = getScentNameTokens(candidate);

              if (!requestTokens.length || !candidateTokens.length) return;

              const everyRequestTokenMatches = requestTokens.every((requestToken) =>
                candidateTokens.some((candidateToken) =>
                  scentTokensMatch(requestToken, candidateToken)
                )
              );

              if (!everyRequestTokenMatches) return;

              if (requestTokens.length === 1) {
                bestScore = Math.max(bestScore, 60);
                return;
              }

              bestScore = Math.max(bestScore, 70 + Math.min(requestTokens.length, 9));
            });

            return bestScore;
          };

          const findExistingProductByRequest = (requestName) => {
            const rankedMatches = products
              .map((product) => ({
                product,
                score: getScentRequestMatchScore(requestName, product),
              }))
              .filter((item) => item.score > 0)
              .sort((a, b) => b.score - a.score);

            if (!rankedMatches.length) return null;

            const [bestMatch, secondMatch] = rankedMatches;

            // A short/ambiguous request such as "Hawas" should not silently open
            // whichever variant happens to appear first in the catalog.
            if (secondMatch && secondMatch.score === bestMatch.score) {
              return null;
            }

            return bestMatch.product;
          };'''

          if old not in source:
            raise SystemExit("normalize/matcher block not found")
          source = source.replace(old, new, 1)

          old = '''const addExistingCollectionRequest = (product) => {
            if (!product?.name) return;

            setExistingCollectionRequests((prev) => {
              const exists = prev.find(
                (item) => item.name.toLowerCase() === product.name.toLowerCase()
              );

              if (exists) {
                return prev
                  .map((item) =>
                    item.name.toLowerCase() === product.name.toLowerCase()
                      ? { ...item, votes: item.votes + 1, product }
                      : item
                  )
                  .sort((a, b) => b.votes - a.votes);
              }

              return [{ name: product.name, votes: 1, product }, ...prev].sort(
                (a, b) => b.votes - a.votes
              );
            });
          };

          '''
          if old not in source:
            raise SystemExit("legacy existing-collection state writer not found")
          source = source.replace(old, "", 1)

          old = '''  if (existingProduct) {
              const result = await sendScentRequest(
                existingProduct.name,
                "existing_collection_request"
              );

              if (result?.status === "blocked") {
                setScentRequestStatus(
                  getVoteCooldownMessage(existingProduct.name, result.remainingDays)
                );

                openProductFromRequest(existingProduct);
                return;
              }

              if (result?.status !== "ok") {
                setScentRequestStatus(
                  lang === "sr"
                    ? "Glas nije prošao. Probaj ponovo."
                    : "Vote was not saved. Please try again."
                );

                return;
              }

              addExistingCollectionRequest(existingProduct);

              setScentRequestStatus(
                lang === "sr"
                  ? `Već deo PlayNice kolekcije ✦ Otvaramo ${existingProduct.name}.`
                  : `Already in our collection ✦ Opening ${existingProduct.name}.`
              );

              openProductFromRequest(existingProduct);
              return;
            }'''
          new = '''  if (existingProduct) {
              setScentRequestStatus(
                lang === "sr"
                  ? `Već deo PlayNice kolekcije ✦ Otvaramo ${existingProduct.name}.`
                  : `Already in our collection ✦ Opening ${existingProduct.name}.`
              );

              openProductFromRequest(existingProduct);
              return;
            }'''
          if old not in source:
            raise SystemExit("community existing-product vote block not found")
          source = source.replace(old, new, 1)

          old = '''    if (existingProduct) {
                const result = await sendScentRequest(
                  existingProduct.name,
                  "existing_collection_request"
                );

                if (result?.status === "blocked") {
                  setScentRequestStatus(
                    getVoteCooldownMessage(fragranceName, result.remainingDays)
                  );

                  setScentRequestValue("");
                  openProductFromRequest(existingProduct);
                  return;
                }

                if (result?.status !== "ok") {
                  setScentRequestStatus(
                    lang === "sr"
                      ? "Glas nije prošao. Probaj ponovo."
                      : "Vote was not saved. Please try again."
                  );

                  return;
                }

                addExistingCollectionRequest(existingProduct);

                setScentRequestValue("");

                setScentRequestStatus(
                  lang === "sr"
                    ? `Već deo PlayNice kolekcije ✦ Otvaramo ${existingProduct.name}.`
                    : `Already in our collection ✦ Opening ${existingProduct.name}.`
                );

                openProductFromRequest(existingProduct);
                return;
              }'''
          new = '''    if (existingProduct) {
                setScentRequestValue("");

                setScentRequestStatus(
                  lang === "sr"
                    ? `Već deo PlayNice kolekcije ✦ Otvaramo ${existingProduct.name}.`
                    : `Already in our collection ✦ Opening ${existingProduct.name}.`
                );

                openProductFromRequest(existingProduct);
                return;
              }'''
          if old not in source:
            raise SystemExit("manual existing-product submit block not found")
          source = source.replace(old, new, 1)

          old = '''  if (result?.status === "blocked") {
              setScentRequestStatus(
                getVoteCooldownMessage(requestName, result.remainingDays)
              );

              return;
            }'''
          new = '''  if (result?.status === "blocked") {
              setScentRequestStatus(
                result.blockReason === "daily_limit"
                  ? lang === "sr"
                    ? `Iskoristio si 3 glasa u poslednja 24 sata. Novi glas možeš dodati za ${result.remainingHours || 1} h.`
                    : `You've used 3 votes in the last 24 hours. You can vote again in ${result.remainingHours || 1}h.`
                  : getVoteCooldownMessage(requestName, result.remainingDays)
              );

              return;
            }'''
          if old not in source:
            raise SystemExit("community blocked block not found")
          source = source.replace(old, new, 1)

          old = '''    if (result?.status === "blocked") {
                setScentRequestStatus(
                  lang === "sr"
                    ? `Već si predložio ${fragranceName}. Možeš ponovo za ${result.remainingDays} dana.`
                    : `You already requested ${fragranceName}. You can request it again in ${result.remainingDays} days.`
                );

                return;
              }'''
          new = '''    if (result?.status === "blocked") {
                setScentRequestStatus(
                  result.blockReason === "daily_limit"
                    ? lang === "sr"
                      ? `Iskoristio si 3 glasa u poslednja 24 sata. Novi glas možeš dodati za ${result.remainingHours || 1} h.`
                      : `You've used 3 votes in the last 24 hours. You can vote again in ${result.remainingHours || 1}h.`
                    : lang === "sr"
                      ? `Već si predložio ${fragranceName}. Možeš ponovo za ${result.remainingDays} dana.`
                      : `You already requested ${fragranceName}. You can request it again in ${result.remainingDays} days.`
                );

                return;
              }'''
          if old not in source:
            raise SystemExit("submit blocked block not found")
          source = source.replace(old, new, 1)

          old = '''    const existingRequest = communityRequests.find(
                (item) =>
                  item.name.toLowerCase() === fragranceName.toLowerCase()
              );'''
          new = '''    const normalizedFragranceName = normalizeScentName(fragranceName);
              const existingRequest = communityRequests.find(
                (item) => normalizeScentName(item.name) === normalizedFragranceName
              );'''
          if old not in source:
            raise SystemExit("request dedupe lookup not found")
          source = source.replace(old, new, 1)

          old = '''          .map((item) =>
                    item.name.toLowerCase() === fragranceName.toLowerCase()
                      ? { ...item, votes: item.votes + 1 }
                      : item
                  )'''
          new = '''          .map((item) =>
                    normalizeScentName(item.name) === normalizedFragranceName
                      ? { ...item, votes: item.votes + 1 }
                      : item
                  )'''
          if old not in source:
            raise SystemExit("request dedupe update not found")
          source = source.replace(old, new, 1)

          old = '''? "Jedan glas po parfemu na svakih 7 dana"
                : "One vote per fragrance every 7 days"'''
          new = '''? "Do 3 glasa u 24h · isti parfem ponovo nakon 3 dana"
                : "Up to 3 votes in 24h · same fragrance again after 3 days"'''
          if old not in source:
            raise SystemExit("community limit label not found")
          source = source.replace(old, new, 1)

          if "existing_collection_request" in source:
            raise SystemExit("legacy existing_collection_request call still present")

          path.write_text(source, encoding="utf-8")
          PY

      - name: Build
        working-directory: playnice-site
        run: |
          npm ci
          npm run build

      - name: Commit App.js changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playnice-site/src/App.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: tighten scent request voting"
          git push origin scent-request-vote-guardrails
