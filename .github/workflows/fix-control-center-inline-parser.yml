name: Fix Control Center Inline Parser

on:
  push:
    branches:
      - control-center-controlled-apply-v2
    paths:
      - ".github/workflows/fix-control-center-inline-parser.yml"

permissions:
  contents: write

jobs:
  patch-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: control-center-controlled-apply-v2

      - name: Patch inline object property parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("control-center/api/create-apply.js")
          text = path.read_text()
          old = r'(?:^|\\n)\\s*'
          new = r'(?:^|\\n|\\{)\\s*'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"Expected exactly 2 parser anchors, found {count}")
          path.write_text(text.replace(old, new))
          PY

      - name: Commit parser fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-center/api/create-apply.js
          git diff --cached --quiet && exit 0
          git commit -m "Support inline object properties in Controlled Apply parser"
          git push origin HEAD:control-center-controlled-apply-v2
