name: Patch community vote optimistic once

on:
  push:
    paths:
      - '.github/workflows/community-vote-optimistic-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scent-request-vote-guardrails
          fetch-depth: 1

      - name: Patch App.js
        run: python .github/scripts/patch-community-vote-optimistic.py

      - name: Install dependencies
        working-directory: playnice-site
        run: npm install --package-lock=false

      - name: Test
        working-directory: playnice-site
        run: npm test -- --watchAll=false

      - name: Production build
        working-directory: playnice-site
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
        run: npx react-scripts build

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playnice-site/src/App.js
          if git diff --cached --quiet; then
            echo 'No App.js changes to commit.'
            exit 0
          fi
          git commit -m 'fix: make community list voting feel instant'
          git push origin HEAD:scent-request-vote-guardrails
