name: Rebuild scent request clean once

on:
  push:
    paths:
      - '.github/workflows/rebuild-scent-request-clean-once.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scent-request-vote-guardrails-clean
          fetch-depth: 0

      - name: Fetch source branch
        run: git fetch origin scent-request-vote-guardrails:scent-request-vote-guardrails

      - name: Build clean App.js patch
        run: |
          git diff --ignore-space-at-eol origin/main scent-request-vote-guardrails -- playnice-site/src/App.js > /tmp/scent-request.patch
          git checkout origin/main -- playnice-site/src/App.js
          git apply --ignore-space-change --ignore-whitespace --whitespace=nowarn /tmp/scent-request.patch

      - name: Install dependencies
        working-directory: playnice-site
        run: npm install --package-lock=false

      - name: Test
        working-directory: playnice-site
        run: npm test -- --watchAll=false

      - name: Production build
        working-directory: playnice-site
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
        run: npx react-scripts build

      - name: Commit clean patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playnice-site/src/App.js
          git commit -m 'feat: improve scent request voting guardrails'
          git push origin HEAD:scent-request-vote-guardrails-clean
