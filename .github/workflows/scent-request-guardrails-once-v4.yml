name: Apply scent request guardrails once v4

on:
  push:
    branches:
      - scent-request-vote-guardrails
    paths:
      - .github/workflows/scent-request-guardrails-once-v4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scent-request-vote-guardrails

      - name: Reuse validated patch logic
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/scent-request-guardrails-once-v3.yml').read_text(encoding='utf-8')
          marker_start = "          python <<'PY'\n"
          marker_end = "          PY\n"
          block = workflow.split(marker_start, 1)[1].split(marker_end, 1)[0]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(code, '<scent-request-patch>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Build
        working-directory: playnice-site
        run: |
          npm install --package-lock=false
          npm run build

      - name: Commit App.js changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playnice-site/src/App.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: tighten scent request voting"
          git push origin scent-request-vote-guardrails
