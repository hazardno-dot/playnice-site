name: Add mobile PDP discount UI

on:
  push:
    branches:
      - mobile-product-page-clean
    paths:
      - playnice-site/scripts/add-mobile-pdp-discount-ui.cjs
      - .github/workflows/add-mobile-pdp-discount-ui.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile-product-page-clean
          fetch-depth: 0

      - name: Apply guarded PDP discount UI migration
        run: node playnice-site/scripts/add-mobile-pdp-discount-ui.cjs

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playnice-site/src/mobile-v2/product-page/MobileProductPage.jsx playnice-site/src/mobile-v2/product-page/MobileProductPage.css
          git commit -m "Add discount presentation to clean mobile PDP [skip ci]"
          git push origin HEAD:mobile-product-page-clean
