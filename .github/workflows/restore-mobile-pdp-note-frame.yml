name: Restore mobile PDP note frame

on:
  push:
    branches:
      - mobile-product-page-clean
    paths:
      - playnice-site/scripts/restore-mobile-pdp-note-frame.cjs
      - .github/workflows/restore-mobile-pdp-note-frame.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile-product-page-clean
          fetch-depth: 0
      - name: Apply guarded restore
        run: node playnice-site/scripts/restore-mobile-pdp-note-frame.cjs
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playnice-site/src/mobile-v2/product-page/MobileProductPage.jsx playnice-site/src/TheNoteMapImpl.jsx
          git commit -m "Restore stable mobile PDP note-map frame behavior [skip ci]"
          git push origin HEAD:mobile-product-page-clean
