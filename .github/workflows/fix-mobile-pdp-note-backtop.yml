name: Fix mobile PDP note map and back to top

on:
  push:
    branches:
      - mobile-product-page-clean
    paths:
      - scripts/fix-mobile-pdp-note-backtop.cjs
      - .github/workflows/fix-mobile-pdp-note-backtop.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile-product-page-clean
          fetch-depth: 0
      - name: Apply guarded fix
        run: node scripts/fix-mobile-pdp-note-backtop.cjs
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playnice-site/src/mobile-v2/product-page/MobileProductPage.css playnice-site/src/App.js
          git commit -m "Fix mobile PDP note map interaction and back to top [skip ci]"
          git push origin HEAD:mobile-product-page-clean
