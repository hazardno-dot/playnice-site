name: Apply Final Products Audit Hardening

on:
  push:
    branches:
      - control-center-controlled-apply-v2
    paths:
      - "control-center/scripts/apply-final-products-audit.mjs"
      - ".github/workflows/apply-final-products-audit.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: control-center-controlled-apply-v2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply final Products audit patch
        run: node control-center/scripts/apply-final-products-audit.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-center/src/App.jsx control-center/src/DraftManager.jsx control-center/src/draftValidation.js control-center/src/inlineValidationRules.mjs control-center/api/create-new-product-engine.js control-center/tests/draft-only-product-lifecycle.mjs
          git commit -m "Close final Products workflow dead states"
          git push origin HEAD:control-center-controlled-apply-v2
