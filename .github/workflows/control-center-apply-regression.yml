name: Control Center Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "control-center/api/**"
      - "control-center/server/**"
      - "control-center/src/**"
      - "control-center/supabase/**"
      - "control-center/tests/**"
      - "control-center/package.json"
      - "control-center/vite.config.js"
      - "control-center/vercel.json"
      - "playnice-site/src/data/products/**"
      - "playnice-site/src/data/heroSlides.generated.js"
      - "playnice-site/src/data/journal/**"
      - "playnice-site/src/features/note-map/**"
      - "playnice-site/public/note-map/**"
      - ".github/workflows/control-center-apply-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-center-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run complete Control Center contract suite
        run: node control-center/tests/run-all.mjs
