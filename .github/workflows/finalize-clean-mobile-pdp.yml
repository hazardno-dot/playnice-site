name: Finalize clean mobile PDP polish

on:
  push:
    branches:
      - mobile-product-page-clean
    paths:
      - scripts/finalize-clean-mobile-pdp.cjs
      - .github/workflows/finalize-clean-mobile-pdp.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile-product-page-clean
          fetch-depth: 0

      - name: Apply guarded codemod
        run: node scripts/finalize-clean-mobile-pdp.cjs

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playnice-site/src/App.js playnice-site/src/mobile-v2/product-page/MobileProductPage.jsx
          git commit -m "Finalize clean mobile PDP interactions [skip ci]"
          git push origin HEAD:mobile-product-page-clean
