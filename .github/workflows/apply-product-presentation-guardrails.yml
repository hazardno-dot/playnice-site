name: Apply product presentation guardrails

on:
  push:
    branches:
      - cc-product-presentation-guardrails

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run product presentation guardrails'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc-product-presentation-guardrails
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply guardrails
        run: python scripts/apply_product_guardrails.py

      - name: Run targeted regression
        run: |
          node control-center/tests/controlled-apply-new-product.mjs
          node control-center/tests/controlled-apply-new-product-structure.mjs
          node control-center/tests/product-presentation-guardrails.mjs

      - name: Build Control Center
        working-directory: control-center
        run: |
          npm install
          npm run build

      - name: Verify scope
        run: |
          git diff --check
          git status --short

      - name: Commit guardrails and clean temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-product-presentation-guardrails.yml scripts/apply_product_guardrails.py .guardrail-trigger
          git add .github/workflows/control-center-apply-regression.yml control-center
          git commit -m "feat: harden product presentation and preview gates"
          git push origin HEAD:cc-product-presentation-guardrails
