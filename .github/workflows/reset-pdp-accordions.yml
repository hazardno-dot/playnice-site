name: Reset PDP accordions

on:
  push:
    branches:
      - mobile-product-page-clean
    paths:
      - playnice-site/scripts/reset-pdp-accordions.cjs
      - .github/workflows/reset-pdp-accordions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-product-page-clean
          fetch-depth: 0
      - name: Apply PDP accordion reset
        run: node playnice-site/scripts/reset-pdp-accordions.cjs
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playnice-site/src/mobile-v2/product-page/MobileProductPage.jsx
          git commit -m "Reset PDP accordions on product change [skip ci]"
          git push origin HEAD:mobile-product-page-clean
