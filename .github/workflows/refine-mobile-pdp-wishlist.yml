name: Refine mobile PDP wishlist

on:
  push:
    branches:
      - mobile-product-page-clean
    paths:
      - playnice-site/scripts/refine-mobile-pdp-wishlist.cjs
      - .github/workflows/refine-mobile-pdp-wishlist.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile-product-page-clean
          fetch-depth: 0

      - name: Apply guarded wishlist polish
        run: node playnice-site/scripts/refine-mobile-pdp-wishlist.cjs

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playnice-site/src/mobile-v2/product-page/MobileProductPage.css
          git commit -m "Refine mobile PDP wishlist shape and color [skip ci]"
          git push origin HEAD:mobile-product-page-clean
