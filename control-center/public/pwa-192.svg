<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512" role="img" aria-label="PlayNice Control Center">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#0b2d74"/>
      <stop offset=".52" stop-color="#061b4e"/>
      <stop offset="1" stop-color="#020817"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6de8ff"/>
      <stop offset=".35" stop-color="#2498ff"/>
      <stop offset=".7" stop-color="#1455ff"/>
      <stop offset="1" stop-color="#46dfff"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset=".38" stop-color="#79dcff"/>
      <stop offset=".7" stop-color="#2a86ff"/>
      <stop offset="1" stop-color="#b6f1ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#020817"/>
  <circle cx="256" cy="256" r="226" fill="url(#bg)" stroke="url(#ring)" stroke-width="8" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="213" fill="none" stroke="#0a58d9" stroke-width="2" opacity=".7"/>

  <g text-anchor="middle" fill="url(#text)" filter="url(#textGlow)" font-family="Georgia, 'Times New Roman', serif">
    <text x="256" y="218" font-size="82" font-weight="700" letter-spacing="-1">PLAYNICE</text>
    <text x="256" y="315" font-size="66" font-weight="700" letter-spacing="4">CONTROL</text>
    <text x="256" y="397" font-size="66" font-weight="700" letter-spacing="4">CENTER</text>
  </g>
</svg>