<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayNice Atmosphere — Rain on Glass · Refraction Study</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d0e10;color:#e8e0d3}
#stage{position:relative;height:100svh;min-height:440px;overflow:hidden}
#scene{width:100%;height:100%;display:block}
#info{position:absolute;top:18px;left:18px;font-size:10px;letter-spacing:.16em;color:#c8baa3;pointer-events:none}
#panel{position:fixed;z-index:5;left:16px;bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 32px);background:#141619e8;border:1px solid #e8cc9630;border-radius:12px;padding:12px;backdrop-filter:blur(12px);font-size:12px}
button{border:0;border-radius:7px;padding:9px 12px;background:#c9aa77;color:#131313;font-weight:650;cursor:pointer}
button.secondary{background:#353330;color:#e9e3d7}
label{display:flex;align-items:center;gap:8px}
#status{font-size:11px;color:#a99d8b}
@media(prefers-reduced-motion:reduce){#status{color:#e9c596}}
</style></head>
<body>
<main id="stage">
<canvas id="scene" aria-label="Rain on glass study, featuring soft translucent drops refracting a dark PlayNice scene"></canvas>
<div id="info">PLAYNICE ATMOSPHERE / OPTICAL REFRACTION STUDY / NOT PRODUCTION</div>
</main>
<div id="panel" role="group" aria-label="Rain prototype controls">
<label><input id="enabled" type="checkbox" checked> Atmosphere on</label>
<button id="one" type="button">One droplet</button>
<button id="three" class="secondary" type="button">Three droplets</button>
<span id="status" role="status">Initializing</span>
</div>
<script>
(function(){
'use strict';
// This is a canvas-local optical refraction experiment, not refraction of arbitrary HTML.
// This prototype deliberately does not attach effects to store pages.
var canvas=document.getElementById('scene');
var context=canvas.getContext('2d',{alpha:false});
var base=document.createElement('canvas');
var baseContext=base.getContext('2d',{alpha:false});
var enabled=document.getElementById('enabled');
var status=document.getElementById('status');
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
var drops=[],raf=0,scheduleId=0,firstId=0,lastFrame=0;
var viewW=0,viewH=0,dpr=1;
var random=function(a,b){return a+Math.random()*(b-a);};
var running=function(){return enabled.checked&&!reduce.matches&&!document.hidden;};
function background(){
 baseContext.setTransform(dpr,0,0,dpr,0,0);
 var g=baseContext.createLinearGradient(0,0,viewW,viewH);
 g.addColorStop(0,'#090b10');g.addColorStop(.45,'#27221e');g.addColorStop(1,'#0b0d13');
 baseContext.fillStyle=g;baseContext.fillRect(0,0,viewW,viewH);
 var glow=baseContext.createRadialGradient(viewW*.83,viewH*.08,5,viewW*.83,viewH*.08,Math.max(viewW,viewH)*.67);
 glow.addColorStop(0,'#b9905740');glow.addColorStop(.48,'#977c5010');glow.addColorStop(1,'#00000000');
 baseContext.fillStyle=glow;baseContext.fillRect(0,0,viewW,viewH);
 baseContext.strokeStyle='#d5b57c24';baseContext.lineWidth=1;
 baseContext.strokeRect(18,18,viewW-36,viewH-36);
 baseContext.textAlign='center';
 baseContext.fillStyle='#d8b987';
 baseContext.font='normal '+Math.min(100,Math.max(41,viewW*.095))+'px Georgia,serif';
 baseContext.fillText('PlayNice.',viewW/2,viewH*.47);
 baseContext.fillStyle='#b6a992';
 baseContext.font='11px system-ui,sans-serif';
 baseContext.fillText('R E M E M B E R .  P L A Y N I C E .',viewW/2,viewH*.54);
 baseContext.fillStyle='#ded7cc';
 baseContext.font='normal '+Math.min(30,Math.max(17,viewW*.028))+'px Georgia,serif';
 baseContext.fillText('A quiet moment, held in glass.',viewW/2,viewH*.66);
 baseContext.fillStyle='#a59b8d';baseContext.font='12px system-ui,sans-serif';
 baseContext.fillText('A visual experiment in atmosphere.',viewW/2,viewH*.71);
}
function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);
 viewW=Math.max(1,canvas.clientWidth);viewH=Math.max(1,canvas.clientHeight);
 canvas.width=base.width=Math.round(viewW*dpr);
 canvas.height=base.height=Math.round(viewH*dpr);
 background();draw();
}
function shape(ctx,x,y,w,h,s){
 // A slightly asymmetric, weighted water drop. Source units: centered in x, top at y.
 ctx.beginPath();
 ctx.moveTo(x-w*.10,y);
 ctx.bezierCurveTo(x+w*.18,y-h*.02,x+w*.36,y+h*.22,x+w*.40,y+h*.43);
 ctx.bezierCurveTo(x+w*.58,y+h*.78,x+w*.30,y+h*1.01,x,y+h);
 ctx.bezierCurveTo(x-w*.40,y+h*1.04,x-w*.55,y+h*.73,x-w*.43,y+h*.44);
 ctx.bezierCurveTo(x-w*.34,y+h*.17,x-w*.26,y+h*.02,x-w*.10,y);
 ctx.closePath();
}
function position(d,age){
 var slip=Math.max(0,age-d.hold);
 var p=Math.min(1,slip/d.moveMs);
 var eased=p*p*(3-2*p);
 var sway=Math.sin(age*.00074+d.phase)*d.swing+Math.sin(age*.00121+d.phase*.7)*d.swing*.36;
 return {x:d.x+sway+p*d.horizontal,y:d.y+eased*d.travel,p:p};
}
function wetTrail(ctx,d){
 // A short, evaporating, discontinuous water track. Render before the main drop.
 var history=d.history;
 if(history.length<2)return;
 ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
 for(var i=1;i<history.length;i++){
  var prev=history[i-1],point=history[i];
  var elapsed=d.age-point.t;
  var life=Math.max(0,1-elapsed/2600);
  // A thin remaining lens edge, never a continuous white paint line.
  if(life<=0)continue;
  ctx.strokeStyle='rgba(219,232,241,'+(life*.13).toFixed(3)+')';
  ctx.lineWidth=Math.max(.6,d.width*.055*life);
  ctx.beginPath();ctx.moveTo(prev.x-d.width*.085,prev.y+d.height*.55);
  ctx.lineTo(point.x-d.width*.085,point.y+d.height*.55);ctx.stroke();
  ctx.strokeStyle='rgba(8,12,19,'+(life*.23).toFixed(3)+')';
  ctx.lineWidth=Math.max(.4,d.width*.035*life);
  ctx.beginPath();ctx.moveTo(prev.x+d.width*.07,prev.y+d.height*.55);
  ctx.lineTo(point.x+d.width*.07,point.y+d.height*.55);ctx.stroke();
 }
 // Retained micro-droplets: the larger drop gradually catches them visually.
 for(var j=0;j<d.satellites.length;j++){
  var dot=d.satellites[j],lag=d.age-dot.born;
  var last=history[history.length-1];
  var distance=Math.hypot(last.x-dot.x,last.y-dot.y);
  var visibility=Math.max(0,1-lag/3100)*Math.min(1,distance/9);
  if(visibility<=0)continue;
  var radius=dot.radius*(.72+.28*visibility);
  ctx.beginPath();ctx.ellipse(dot.x,dot.y,radius,radius*1.36,-.12,0,Math.PI*2);
  ctx.fillStyle='rgba(184,201,211,'+(visibility*.2).toFixed(3)+')';ctx.fill();
  ctx.strokeStyle='rgba(230,238,244,'+(visibility*.45).toFixed(3)+')';
  ctx.lineWidth=.6;ctx.stroke();
  ctx.beginPath();ctx.arc(dot.x-radius*.28,dot.y-radius*.3,Math.max(.35,radius*.22),0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,'+(visibility*.42).toFixed(3)+')';ctx.fill();
 }
 ctx.restore();
}
function droplet(ctx,d){
 var age=d.age;
 var xy=position(d,age),p=xy.p,x=xy.x,y=xy.y;
 var stretch=1+Math.min(.19,p*.22);
 var w=d.width,h=d.height*stretch;
 var appear=Math.min(1,age/650);
 var fade=Math.min(1,(d.lifetime-age)/1200);
 var alpha=Math.max(0,Math.min(appear,fade))*.95;
 if(alpha<=0)return;
 ctx.save();ctx.globalAlpha=alpha;
 ctx.translate(x,y);ctx.rotate(Math.sin(age*.00058+d.phase)*.035+d.tilt);
 ctx.translate(-x,-y);
 // Local image-space displacement: the clipped backdrop is magnified and shifted
 // beneath the water volume. This is an approximation of optical lens refraction.
 shape(ctx,x,y,w,h);ctx.save();ctx.clip();
 var sx=(x-w*.53)*dpr,sy=(y-h*.04)*dpr,sw=w*1.06*dpr,sh=h*1.09*dpr;
 // Guard against drawImage source rectangles reaching off-canvas.
 var sourceX=Math.max(0,sx),sourceY=Math.max(0,sy);
 var sourceR=Math.min(base.width,sx+sw),sourceB=Math.min(base.height,sy+sh);
 if(sourceR>sourceX&&sourceB>sourceY){
  var scale=1.24;
  var dx=x-w*.53+(sourceX-sx)/dpr;
  var dy=y-h*.04+(sourceY-sy)/dpr;
  var dw=(sourceR-sourceX)/dpr,dh=(sourceB-sourceY)/dpr;
  ctx.drawImage(base,sourceX,sourceY,sourceR-sourceX,sourceB-sourceY,
    x+(dx-x)*scale+w*.035,y+(dy-y)*scale-h*.03,dw*scale,dh*scale);
 }
 var shade=ctx.createLinearGradient(x-w*.5,y,x+w*.6,y+h);
 shade.addColorStop(0,'#ffffff13');shade.addColorStop(.31,'#d2e6ff08');
 shade.addColorStop(.72,'#080c1740');shade.addColorStop(1,'#ffffff19');
 ctx.fillStyle=shade;ctx.fillRect(x-w,y-h*.1,w*2,h*1.3);
 ctx.restore();
 // Dark inside-edge caustic + bright external rim with a directional specular highlight.
 ctx.shadowColor='#000b';ctx.shadowBlur=5;ctx.shadowOffsetY=2;
 ctx.strokeStyle='#111821aa';ctx.lineWidth=Math.max(1.1,w*.08);shape(ctx,x,y,w,h);ctx.stroke();
 ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 var rim=ctx.createLinearGradient(x-w*.55,y,x+w*.55,y+h*.7);
 rim.addColorStop(0,'#ffffffcf');rim.addColorStop(.30,'#dae7f63f');
 rim.addColorStop(.65,'#0a101856');rim.addColorStop(1,'#f9fcff9c');
 ctx.lineWidth=Math.max(.6,w*.038);ctx.strokeStyle=rim;shape(ctx,x,y,w,h);ctx.stroke();
 var sparkle=ctx.createRadialGradient(x-w*.18,y+h*.22,0,x-w*.18,y+h*.22,w*.31);
 sparkle.addColorStop(0,'#ffffffe0');sparkle.addColorStop(.38,'#ffffff72');sparkle.addColorStop(1,'#ffffff00');
 ctx.fillStyle=sparkle;ctx.beginPath();ctx.ellipse(x-w*.18,y+h*.22,w*.31,h*.23,-.25,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function draw(){
 context.setTransform(1,0,0,1,0,0);
 context.clearRect(0,0,canvas.width,canvas.height);
 context.drawImage(base,0,0);
 context.setTransform(dpr,0,0,dpr,0,0);
 for(var i=0;i<drops.length;i++)wetTrail(context,drops[i]);
 for(var j=0;j<drops.length;j++)droplet(context,drops[j]);
}
function loop(t){
 raf=0;if(!running()){lastFrame=0;return;}
 var delta=Math.min(50,t-(lastFrame||t));lastFrame=t;
 drops=drops.filter(function(d){
  d.age+=delta;
  var xy=position(d,d.age);
  if(d.age>d.hold&&d.age<d.hold+d.moveMs&&d.age-d.lastSample>=75){
   var previous=d.history[d.history.length-1];
   var moved=!previous||Math.hypot(xy.x-previous.x,xy.y-previous.y)>1.2;
   if(moved){
    d.history.push({x:xy.x,y:xy.y,t:d.age});d.lastSample=d.age;
    if(Math.random()<.075&&d.satellites.length<4){
     d.satellites.push({x:xy.x+random(-d.width*.18,d.width*.18),y:xy.y+d.height*.5,born:d.age,radius:random(.8,1.65)});
    }
   }
  }
  d.history=d.history.filter(function(p){return d.age-p.t<2650;});
  d.satellites=d.satellites.filter(function(dot){
   // Surface-water cohesion: tiny beads begin slowly then drift toward the main droplet.
   var factor=Math.min(.115,delta/850);
   dot.x+=(xy.x-dot.x)*factor;
   dot.y+=(xy.y+d.height*.53-dot.y)*factor;
   return d.age-dot.born<3200;
  });
  return d.age<d.lifetime;
 });
 draw();
 if(drops.length)raf=requestAnimationFrame(loop);else lastFrame=0;
}
function spawn(){
 if(!running()||drops.length>=3)return;
 var width=random(13,26);
 var height=width*random(1.2,1.7);
 var x=random(45,Math.max(46,viewW-45));
 var y=random(65,Math.max(66,viewH*.59));
 var travel=random(38,150);
 var hold=random(1700,5800);
 var moveMs=random(6500,14000);
 drops.push({x:x,y:y,width:width,height:height,hold:hold,moveMs:moveMs,
  lifetime:hold+moveMs+900,travel:travel,swing:random(1.5,6),horizontal:random(-9,9),
  phase:random(0,20),tilt:random(-.07,.07),age:0,history:[],satellites:[],lastSample:0});
 draw();if(!raf)raf=requestAnimationFrame(loop);
}
function queue(){
 clearTimeout(scheduleId);
 if(!running())return;
 scheduleId=setTimeout(function(){
  if(running()){spawn();if(Math.random()<.24)setTimeout(spawn,random(300,1200));}
  queue();
 },random(12000,39000));
}
function reset(){
 clearTimeout(scheduleId);clearTimeout(firstId);
 if(raf)cancelAnimationFrame(raf);raf=0;lastFrame=0;drops=[];draw();
 status.textContent=!enabled.checked?'Disabled':reduce.matches?'Reduced motion: disabled':document.hidden?'Paused':'Ready · 0–3 droplets';
 if(running()){queue();firstId=setTimeout(spawn,random(4000,8000));}
}
enabled.checked=localStorage.getItem('playnice-atmosphere-poc')!=='off';
enabled.addEventListener('change',function(){localStorage.setItem('playnice-atmosphere-poc',enabled.checked?'on':'off');reset();});
document.getElementById('one').addEventListener('click',spawn);
document.getElementById('three').addEventListener('click',function(){spawn();spawn();spawn();});
document.addEventListener('visibilitychange',reset);
reduce.addEventListener('change',reset);
window.addEventListener('resize',resize);
resize();reset();
})();
</script></body></html>
