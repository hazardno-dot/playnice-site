<!doctype html>
<html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayNice Atmosphere — Real Page Context QA</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}
html,body{margin:0;background:#0d0d0e;color:#eee}
#site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#080808}
#glass{position:fixed;inset:0;pointer-events:none;z-index:50}
#tools{position:fixed;z-index:60;bottom:14px;left:12px;right:12px;display:flex;align-items:center;flex-wrap:wrap;gap:9px;max-width:620px;padding:11px;background:#131518e9;border:1px solid #c6a57355;border-radius:13px;backdrop-filter:blur(14px);font-size:12px}
button{background:#c9ac7a;color:#171411;border:0;border-radius:7px;padding:9px 10px;cursor:pointer;font-weight:600}
button.alt{background:#343331;color:#f2ede5}label{display:flex;align-items:center;gap:5px}small{color:#b5ab9f}
#banner{position:fixed;z-index:60;top:4px;left:4px;background:#111b;color:#e9d5a9;padding:5px 9px;border-radius:5px;font-size:10px;letter-spacing:.05em;pointer-events:none}
@media(prefers-reduced-motion:reduce){#glass{display:none}}
</style></head><body>
<iframe id="site" title="PlayNice Preview — actual homepage" src="/"></iframe>
<canvas id="glass" aria-hidden="true"></canvas>
<div id="banner">ATMOSPHERE CONTEXT TEST · PREVIEW ONLY · NO DOM REFRACTION</div>
<div id="tools">
<label><input id="toggle" type="checkbox" checked> Atmosphere</label>
<button id="one">Jedna kap</button><button id="three" class="alt">Tri kapi</button>
<button id="home" class="alt">Homepage</button><button id="journal" class="alt">Journal</button>
<small id="state">Priprema...</small>
</div>
<script>
(()=>{
'use strict';
const frame=document.getElementById('site'),canvas=document.getElementById('glass'),ctx=canvas.getContext('2d'),toggle=document.getElementById('toggle'),state=document.getElementById('state');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let drops=[],raf=0,prev=0,timer=0,first=0,w=0,h=0,dpr=1,mode='home',routeTimer=0;
const rand=(a,b)=>a+Math.random()*(b-a);
const allowed=()=>toggle.checked&&!reduced.matches&&!document.hidden&&(mode==='home'||mode==='journal');
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);draw();}
function pos(d){let t=Math.min(1,Math.max(0,(d.age-d.hold)/d.duration));let p=d.type===0?.25*t+.75*t*t:d.type===1?t*t*(3-2*t):t<.26?.16*t:t<.52?.0416+(t-.26)*.62:t<.72?.2028+(t-.52)*.1:.2228+(t-.72)*(.7772/.28);return {x:d.x+p*d.dx,y:d.y+p*d.travel,p};}
function path(x,y,ww,hh){
 ctx.beginPath();ctx.moveTo(x-ww*.045,y);
 ctx.bezierCurveTo(x+ww*.06,y+hh*.10,x+ww*.22,y+hh*.22,x+ww*.34,y+hh*.38);
 ctx.bezierCurveTo(x+ww*.56,y+hh*.67,x+ww*.42,y+hh*.94,x+ww*.03,y+hh*.97);
 ctx.bezierCurveTo(x-ww*.42,y+hh*1.0,x-ww*.55,y+hh*.70,x-ww*.35,y+hh*.42);
 ctx.bezierCurveTo(x-ww*.22,y+hh*.23,x-ww*.14,y+hh*.08,x-ww*.045,y);ctx.closePath();
}
function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.setTransform(dpr,0,0,dpr,0,0);if(!allowed())return;
 for(const d of drops){
  const xy=pos(d),x=xy.x,y=xy.y;
  for(const s of d.film){
   const age=d.age-s.t,life=Math.max(0,1-age/2900);if(!life)continue;
   ctx.beginPath();ctx.ellipse(s.x,s.y,s.r,s.r*s.aspect,s.angle,0,Math.PI*2);
   ctx.fillStyle='rgba(225,238,244,'+(life*.095)+')';ctx.fill();
   ctx.strokeStyle='rgba(255,255,255,'+(life*.10)+')';ctx.lineWidth=.45;ctx.stroke();
  }
  for(const bead of d.beads){const life=Math.max(0,1-(d.age-bead.t)/3500);if(!life)continue;
   ctx.beginPath();ctx.ellipse(bead.x,bead.y,bead.r,bead.r*1.2,0,0,Math.PI*2);
   ctx.fillStyle='rgba(178,204,220,'+(life*.19)+')';ctx.fill();
   ctx.strokeStyle='rgba(246,250,255,'+(life*.3)+')';ctx.lineWidth=.5;ctx.stroke();
  }
  const a=Math.min(1,d.age/500,(d.lifetime-d.age)/1100)*.83;if(a<=0)continue;
  ctx.save();ctx.globalAlpha=a;path(x,y,d.width,d.height*(1+.12*xy.p));
  // Transparent overlay: outlines and highlights only; exact refraction of live
  // iframe DOM pixels is deliberately not claimed or simulated here.
  const lens=ctx.createLinearGradient(x-d.width*.5,y,x+d.width*.5,y+d.height);
  lens.addColorStop(0,'rgba(255,255,255,.13)');lens.addColorStop(.45,'rgba(140,176,194,.045)');lens.addColorStop(.82,'rgba(5,11,20,.12)');lens.addColorStop(1,'rgba(250,254,255,.18)');
  ctx.fillStyle=lens;ctx.fill();
  ctx.strokeStyle='rgba(232,242,250,.35)';ctx.lineWidth=.9;ctx.stroke();
  ctx.beginPath();ctx.ellipse(x-d.width*.18,y+d.height*.26,d.width*.12,d.height*.10,-.2,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.36)';ctx.fill();ctx.restore();
 }
}
function tick(t){
 raf=0;if(!allowed()){prev=0;return}
 let dt=Math.min(48,t-(prev||t));prev=t;
 drops=drops.filter(d=>{d.age+=dt;const p=pos(d);
  if(d.age>d.hold&&d.age<d.hold+d.duration&&d.age-d.last>110){
   const old=d.lastP;if(!old||Math.hypot(old.x-p.x,old.y-p.y)>2){
    d.last=d.age;d.lastP=p;
    if(Math.random()<.55)d.film.push({x:p.x+rand(-2.5,2.5),y:p.y+d.height*.27,r:rand(.4,1.5),aspect:rand(1,2),angle:rand(-.3,.3),t:d.age});
    if(Math.random()<.13&&d.beads.length<7)d.beads.push({x:p.x+rand(-3,3),y:p.y+d.height*.23,t:d.age,r:rand(.55,1.6)});
   }
  }
  d.film=d.film.filter(s=>d.age-s.t<3000);
  d.beads=d.beads.filter(b=>{let age=d.age-b.t;if(age>650){b.x+=(p.x-b.x)*.015;b.y+=(p.y+d.height*.64-b.y)*.015}return age<3600&&Math.hypot(b.x-p.x,b.y-(p.y+d.height*.64))>2});
  return d.age<d.lifetime;
 });draw();
 if(drops.length)raf=requestAnimationFrame(tick);else prev=0;
}
function spawn(){if(!allowed()||drops.length>=3)return;const type=Math.floor(rand(0,3)),width=rand(10,19),hold=type===0?rand(500,1600):type===1?rand(1600,3400):rand(2200,5000),duration=type===0?rand(2500,4200):type===1?rand(6500,11000):rand(11500,18500);
 drops.push({type,width,height:width*rand(1.5,1.9),x:rand(35,Math.max(36,w-35)),y:rand(60,Math.max(61,h*.52)),dx:type===1?rand(8,20)*(Math.random()<.5?-1:1):rand(-1,1),travel:type===0?rand(165,270):type===1?rand(100,180):rand(45,110),age:0,hold,duration,lifetime:hold+duration+700,film:[],beads:[],last:0,lastP:null});
 if(!raf)raf=requestAnimationFrame(tick);
}
function schedule(){clearTimeout(timer);if(!allowed())return;timer=setTimeout(()=>{spawn();if(Math.random()<.18)setTimeout(spawn,650);schedule()},rand(13000,41000));}
function reset(){clearTimeout(timer);clearTimeout(first);if(raf)cancelAnimationFrame(raf);raf=0;prev=0;drops=[];draw();state.textContent=!toggle.checked?'Isključeno':reduced.matches?'Reduced motion':mode==='off'?'Van testnih stranica':'Test aktivan';if(allowed()){schedule();first=setTimeout(spawn,rand(4000,8000));}}
function setPage(page){mode=page;frame.src=page==='home'?'/':'/journal';reset()}
function checkLocation(){try{const path=frame.contentWindow.location.pathname;const next=path==='/'?'home':path==='/journal'||path.startsWith('/journal/')?'journal':'off';if(next!==mode){mode=next;reset()}}catch{if(mode!=='off'){mode='off';reset()}}}
document.getElementById('home').onclick=()=>setPage('home');
document.getElementById('journal').onclick=()=>setPage('journal');
document.getElementById('one').onclick=spawn;
document.getElementById('three').onclick=()=>{spawn();spawn();spawn()};
toggle.checked=localStorage.getItem('playnice-atmosphere-context')!=='off';
toggle.onchange=()=>{localStorage.setItem('playnice-atmosphere-context',toggle.checked?'on':'off');reset()};
frame.addEventListener('load',checkLocation);
routeTimer=setInterval(checkLocation,900);
document.addEventListener('visibilitychange',reset);
reduced.addEventListener('change',reset);
addEventListener('resize',resize);
resize();reset();
})();
</script></body></html>
